name: Build and Push

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - requirements.lock
      - .github/workflows/build.yml
  schedule:
    - cron: "30 */6 * * *" # Check for new yt-dlp every 6 h
    - cron: "30 4 * * 1"   # Weekly forced rebuild (Mon 04:30 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Resolve versions, verify attestation, decide whether to build ──
  resolve:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ytdlp_version: ${{ steps.out.outputs.ytdlp_version }}
      deno_version: ${{ steps.out.outputs.deno_version }}
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Resolve latest yt-dlp from PyPI
        id: ytdlp
        run: |
          set -euo pipefail
          RESP=$(curl -sSf https://pypi.org/pypi/yt-dlp/json)
          VERSION=$(printf '%s' "$RESP" | jq -r '.info.version')

          if ! printf '%s' "$VERSION" | grep -qE '^20[0-9]{2}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]+)?$'; then
            echo "::error::Unexpected yt-dlp version format: ${VERSION}"
            exit 1
          fi

          UPLOAD_TIME=$(printf '%s' "$RESP" \
            | jq -r '[.urls[] | select(.filename | endswith(".whl"))][0].upload_time_iso_8601')
          UPLOAD_EPOCH=$(date -d "$UPLOAD_TIME" +%s)
          NOW_EPOCH=$(date +%s)
          AGE_H=$(( (NOW_EPOCH - UPLOAD_EPOCH) / 3600 ))

          echo "version=${VERSION}"   >> "$GITHUB_OUTPUT"
          echo "age_hours=${AGE_H}"   >> "$GITHUB_OUTPUT"

      - name: Resolve latest Deno from GitHub
        id: deno
        run: |
          set -euo pipefail
          TAG=$(curl -sSf \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/denoland/deno/releases/latest \
            | jq -r '.tag_name')
          VER="${TAG#v}"

          if ! printf '%s' "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Unexpected Deno version format: ${VER}"
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Verify yt-dlp PyPI attestation (Trusted Publishing)
        run: |
          set -euo pipefail
          VERSION="${{ steps.ytdlp.outputs.version }}"
          WHEEL="yt_dlp-${VERSION}-py3-none-any.whl"
          PROV=$(curl -sSf \
            "https://pypi.org/integrity/yt-dlp/${VERSION}/${WHEEL}/provenance")

          KIND=$(printf '%s' "$PROV" | jq -r '.attestation_bundles[0].publisher.kind')
          REPO=$(printf '%s' "$PROV" | jq -r '.attestation_bundles[0].publisher.repository')

          if [ "$KIND" != "GitHub" ] || [ "$REPO" != "yt-dlp/yt-dlp" ]; then
            echo "::error::Attestation failed: expected GitHub/yt-dlp/yt-dlp, got ${KIND}/${REPO}"
            exit 1
          fi
          echo "::notice::yt-dlp ${VERSION} attestation verified (${REPO})"

      - name: Decide whether to build
        id: decide
        run: |
          set -euo pipefail
          VERSION="${{ steps.ytdlp.outputs.version }}"
          AGE="${{ steps.ytdlp.outputs.age_hours }}"
          IMAGE="${{ vars.DOCKERHUB_USERNAME }}/yt-dlp"

          TAG_EXISTS=false
          HTTP=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${VERSION}/")
          [ "$HTTP" = "200" ] && TAG_EXISTS=true

          SHOULD=false
          case "${{ github.event_name }}" in
            push|workflow_dispatch)
              SHOULD=true ;;
            schedule)
              if [ "${{ github.event.schedule }}" = "30 4 * * 1" ]; then
                SHOULD=true  # weekly forced rebuild
              elif [ "$AGE" -lt 24 ]; then
                echo "::notice::yt-dlp ${VERSION} is ${AGE} h old (<24 h), skipping"
              elif [ "$TAG_EXISTS" = true ]; then
                echo "::notice::Tag ${VERSION} already exists, skipping"
              else
                SHOULD=true
              fi ;;
          esac
          echo "should_build=${SHOULD}" >> "$GITHUB_OUTPUT"

      - name: Set outputs
        id: out
        run: |
          echo "ytdlp_version=${{ steps.ytdlp.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "deno_version=${{ steps.deno.outputs.version }}"    >> "$GITHUB_OUTPUT"

  # ── Build multi-arch image, scan, push ──
  build-push:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.prep.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate lockfile for target version
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve.outputs.ytdlp_version }}"
          docker run --rm python:3.13-slim sh -c "
            pip install --quiet pip-tools >/dev/null 2>&1 &&
            echo \"yt-dlp[default]==${VERSION}\" > /tmp/req.in &&
            pip-compile --generate-hashes --output-file=- \
              --strip-extras --no-annotate --no-header /tmp/req.in 2>/dev/null
          " > requirements.lock

          if ! grep -q "yt-dlp==${VERSION}" requirements.lock; then
            echo "::error::Lockfile missing yt-dlp==${VERSION}"
            exit 1
          fi

      - name: Prepare tags
        id: prep
        run: |
          VERSION="${{ needs.resolve.outputs.ytdlp_version }}"
          IMAGE="docker.io/${{ vars.DOCKERHUB_USERNAME }}/yt-dlp"
          DATE="$(date -u +%Y%m%d)"
          SHA7="${GITHUB_SHA::7}"

          {
            echo "image=${IMAGE}"
            echo "version_tag=${IMAGE}:${VERSION}"
            echo "immutable_tag=${IMAGE}:${VERSION}-${DATE}-${SHA7}"
            echo "latest_tag=${IMAGE}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (version tags only)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.prep.outputs.version_tag }}
            ${{ steps.prep.outputs.immutable_tag }}
          build-args: |
            YTDLP_VERSION=${{ needs.resolve.outputs.ytdlp_version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ steps.prep.outputs.image }}@${{ steps.build.outputs.digest }}"
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push :latest tag
        run: |
          docker buildx imagetools create \
            -t "${{ steps.prep.outputs.latest_tag }}" \
            "${{ steps.prep.outputs.image }}@${{ steps.build.outputs.digest }}"

  # ── Keyless cosign ──
  sign:
    needs: [resolve, build-push]
    if: needs.build-push.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign image by digest
        run: |
          cosign sign --yes \
            "${{ needs.build-push.outputs.image }}@${{ needs.build-push.outputs.digest }}"
